<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vero Studio – panel ekipy</title>
<meta name="theme-color" content="#F1EBE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vero">
<meta name="application-name" content="Vero">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="panel.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F2F3F5;
  --surface:#FFFFFF;
  --surface-2:#F6F7F9;
  --ink:#12151C;
  --ink-2:#5A606E;
  --line:#E1E4EA;
  --accent:#12151C;
  --accent-ink:#FFFFFF;
  --photo:#2C6BED;
  --video:#8A4DD8;
  --booth:#E2572B;
  --ok:#1B7F50;
  --ok-bg:#E2F3EA;
  --warn:#8F5A05;
  --warn-bg:#FBEFD6;
  --danger:#B8352A;
  --logo-bg:transparent;
  --f-head:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117;--surface:#161A22;--surface-2:#1C212B;--ink:#EDEFF4;--ink-2:#9AA1B1;--line:#272D3A;
    --accent:#EDEFF4;--accent-ink:#0E1117;
    --photo:#6E9BFF;--video:#B78CF2;--booth:#FF8A63;
    --ok:#4FC98A;--ok-bg:#12281D;--warn:#E5B352;--warn-bg:#2B2210;--danger:#FF7B6B;--logo-bg:#EFE8DD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117;--surface:#161A22;--surface-2:#1C212B;--ink:#EDEFF4;--ink-2:#9AA1B1;--line:#272D3A;
  --accent:#EDEFF4;--accent-ink:#0E1117;
  --photo:#6E9BFF;--video:#B78CF2;--booth:#FF8A63;
  --ok:#4FC98A;--ok-bg:#12281D;--warn:#E5B352;--warn-bg:#2B2210;--danger:#FF7B6B;--logo-bg:#EFE8DD;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* nagłówek */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{display:block;height:56px;width:auto;max-width:60vw;background:var(--logo-bg);border-radius:10px;padding:2px 8px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* liczby */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat .l{font-size:12px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-family:var(--f-head);font-weight:700;font-size:1.55rem;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.hot .v{color:var(--warn)}
.stat.good .v{color:var(--ok)}

/* zakładki */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--ink-2);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.btn{font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.take{border-color:var(--c)}
.btn.take:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.btn.mine{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c)}
.btn.small{padding:4px 10px;min-height:30px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}

/* karty sesji */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sess{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 14px;padding:14px 16px}
.date{text-align:center;padding-top:2px}
.date .d{font-family:var(--f-head);font-weight:700;font-size:2rem;line-height:1}
.date .m{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-top:4px}
.date .w{font-size:12px;color:var(--ink-2)}
.sess-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sess h3{font-size:1.1rem;line-height:1.3}
.meta{color:var(--ink-2);font-size:13px;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 12px}
.note{margin-top:8px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.roles{grid-column:1 / -1;margin-top:10px}
.role{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.role-l{min-width:0;display:flex;flex-direction:column;gap:6px}
.role-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.rname{font-weight:600}
.rate{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;min-height:26px}
.chip.me{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip.free{border-style:dashed;background:transparent;color:var(--ink-2)}
.chip.queue{opacity:.7;font-style:italic}
.chip button{border:0;background:none;cursor:pointer;padding:0 2px;line-height:1;color:var(--ink-2);font-size:15px}
.photo{--c:var(--photo)}.video{--c:var(--video)}.booth{--c:var(--booth)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag.you{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
.tag.full{background:var(--ok-bg);color:var(--ok)}
.tag.gap{background:var(--warn-bg);color:var(--warn)}

.past-toggle{align-self:flex-start}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2)}

/* rozliczenia */
.person{padding:14px 16px}
.person-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.person-h img{width:36px;height:36px;border-radius:50%;flex:none}
.person-h .nm{font-family:var(--f-head);font-weight:600;font-size:1.05rem;flex:1;min-width:120px}
.sums{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2)}
.sums b{display:block;font-family:var(--f-head);font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.sums .due b{color:var(--warn)}
.sums .paid b{color:var(--ok)}
.rows{margin-top:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row .t{min-width:0}
.row .t .a{font-weight:500}
.row .t .b{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.amt{font-family:var(--f-head);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.plan{background:var(--surface-2);color:var(--ink-2)}
.row-r{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:520px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row-r{grid-column:1 / -1;justify-content:space-between}
  .sess{grid-template-columns:52px minmax(0,1fr);gap:0 10px;padding:12px}
  .date .d{font-size:1.6rem}
  .role{grid-template-columns:minmax(0,1fr)}
  .role .btn{justify-self:start}
}

/* formularz */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.55);overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:560px;margin:0 auto;padding:18px}
.panel h2{font-size:1.25rem;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolebox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.rolebox .rt{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.rolebox .two .field{margin-bottom:0}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.actions .r{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
.inq{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 14px;padding:14px 16px;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.inq:hover{background:var(--surface-2)}
.inq-main{min-width:0}
.inq-t b{font-family:var(--f-head)}
.inq-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:4px 0 12px}
.dl dt{color:var(--ink-2)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec h3{font-size:1rem;margin-bottom:8px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center;margin-bottom:8px}
.qrow input{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.panel .role-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.checks{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
@media (max-width:520px){.inq{flex-direction:column}.inq-r{align-items:flex-start}.tags{justify-content:flex-start}.dl{grid-template-columns:84px minmax(0,1fr)}}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 0}
.center img{height:84px;width:auto;max-width:80vw;background:var(--logo-bg);border-radius:12px;padding:4px 10px}
.center h1{font-size:1.5rem}
.center p{color:var(--ink-2);max-width:420px;margin:0}
.center .btn{min-height:44px;padding:10px 20px}
.linkish{color:var(--ink-2);font-size:13px}
.person-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
.person-row img,.person-row .av{width:36px;height:36px;border-radius:50%;flex:none;background:var(--surface-2)}
.person-row .nm{flex:1;min-width:140px}
.person-row .nm b{font-family:var(--f-head)}
.person-row .nm div{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}

</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Ładowanie…</div></div>
<div id="overlay" hidden></div>
<div id="toast" hidden></div>
<script src="config.js"></script>
<script>
(function () {
'use strict';
var CFG = window.VERO_CONFIG || {};
var CONTACT = CFG.CONTACT || {};

/* ---------- połączenie z Supabase (logowanie Google, baza, wysyłka maili) ---------- */
var api = (function () {
  var BASE = String(CFG.SUPABASE_URL || '').replace(/\/+$/, '');
  var KEY = String(CFG.SUPABASE_ANON_KEY || '');
  var STORE = 'vero.session.v1';
  var sess = null;
  var refreshing = null;

  function configured() { return /^https?:\/\//.test(BASE) && KEY && !/TWOJ-PROJEKT|WKLEJ_TU/i.test(BASE + KEY); }
  function now() { return Math.floor(Date.now() / 1000); }
  function readStore() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
  function writeStore() { try { if (sess) localStorage.setItem(STORE, JSON.stringify(sess)); else localStorage.removeItem(STORE); } catch (e) {} }
  function fail(status, code, message) { var e = new Error(message || code); e.status = status; e.code = code; return e; }

  async function http(url, opts) {
    var res;
    try { res = await fetch(url, opts); } catch (e) { throw fail(0, 'network', 'Brak połączenia z serwerem.'); }
    var text = await res.text();
    var data = null;
    if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
    if (!res.ok) {
      var code = (data && (data.code || data.error)) || String(res.status);
      var msg = (data && (data.message || data.msg || data.error_description || data.error)) || ('HTTP ' + res.status);
      throw fail(res.status, String(code), String(msg));
    }
    return data;
  }

  function userFrom(u) {
    var m = (u && u.user_metadata) || {};
    return { id: u.id, email: u.email || '', name: m.full_name || m.name || '', avatar: m.avatar_url || '' };
  }

  async function refresh() {
    if (refreshing) return refreshing;
    refreshing = (async function () {
      try {
        if (!sess || !sess.refresh) throw fail(401, 'signed_out');
        var d = await http(BASE + '/auth/v1/token?grant_type=refresh_token', {
          method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: sess.refresh })
        });
        sess = { access: d.access_token, refresh: d.refresh_token, exp: d.expires_at || (now() + (d.expires_in || 3600)), user: d.user ? userFrom(d.user) : sess.user };
        writeStore();
      } catch (e) {
        if (e.code !== 'network') { sess = null; writeStore(); throw fail(401, 'signed_out', 'Sesja wygasła. Zaloguj się ponownie.'); }
        throw e;
      } finally { refreshing = null; }
    })();
    return refreshing;
  }

  async function call(method, path, o) {
    o = o || {};
    if (sess && sess.exp - 60 < now()) await refresh();
    var attempt = 0;
    for (;;) {
      var headers = { apikey: KEY };
      if (sess) headers.Authorization = 'Bearer ' + sess.access;
      if (o.body !== undefined) headers['Content-Type'] = 'application/json';
      if (o.prefer) headers.Prefer = o.prefer;
      try {
        return await http(BASE + path, { method: method, headers: headers, body: o.body === undefined ? undefined : JSON.stringify(o.body) });
      } catch (e) {
        if (e.status === 401 && sess && attempt === 0 && /JWT|expired/i.test(e.message + e.code)) { attempt++; await refresh(); continue; }
        throw e;
      }
    }
  }

  function eq(v) { return 'eq.' + encodeURIComponent(v); }

  var A = {
    configured: configured,

    /** Wraca po zalogowaniu Google (tokeny w adresie) albo odtwarza zapis z przeglądarki. */
    init: async function () {
      var hash = location.hash || '';
      if (/access_token=|error=/.test(hash)) {
        var p = new URLSearchParams(hash.replace(/^#/, ''));
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        if (p.get('error')) throw fail(400, 'oauth', p.get('error_description') || p.get('error'));
        sess = { access: p.get('access_token'), refresh: p.get('refresh_token'), exp: Number(p.get('expires_at')) || (now() + Number(p.get('expires_in') || 3600)), user: null };
        var u = await http(BASE + '/auth/v1/user', { headers: { apikey: KEY, Authorization: 'Bearer ' + sess.access } });
        sess.user = userFrom(u);
        writeStore();
        return sess.user;
      }
      sess = readStore();
      if (!sess) return null;
      if (sess.exp - 60 < now()) await refresh();
      return sess.user;
    },
    signIn: function () {
      var back = location.origin + location.pathname;
      location.href = BASE + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(back);
    },
    signOut: async function () {
      try { if (sess) await http(BASE + '/auth/v1/logout', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + sess.access } }); } catch (e) {}
      sess = null; writeStore();
    },
    currentUser: function () { return sess && sess.user; },

    ensureProfile: function () { return call('POST', '/rest/v1/rpc/ensure_profile', { body: {} }); },

    loadAll: async function (isOwner) {
      var jobs = [
        call('GET', '/rest/v1/sessions?select=id,title,client,event_date,start_time,location,notes,slots,created_at&order=event_date.asc'),
        call('GET', '/rest/v1/signups?select=session_id,role,user_id,created_at'),
        call('GET', '/rest/v1/payments?select=session_id,role,user_id,amount,paid_at'),
        call('GET', '/rest/v1/profiles?select=id,name,avatar_url,role,approved'),
        isOwner ? call('GET', '/rest/v1/inquiries?select=*&order=created_at.desc') : Promise.resolve([])
      ];
      var r = await Promise.all(jobs);
      return A.mapAll(r[0], r[1], r[2], r[3], r[4]);
    },

    mapAll: function (sRows, gRows, pRows, profRows, qRows) {
      var sessions = (sRows || []).map(function (r) {
        return { id: r.id, title: r.title, client: r.client || '', date: r.event_date, time: r.start_time || '', location: r.location || '', notes: r.notes || '', slots: r.slots || {}, createdAt: r.created_at };
      });
      var signups = {};
      (gRows || []).forEach(function (r) {
        var u = (signups[r.user_id] = signups[r.user_id] || {});
        var s = (u[r.session_id] = u[r.session_id] || {});
        s[r.role] = Date.parse(r.created_at) || 1;
      });
      var payments = {};
      (pRows || []).forEach(function (r) {
        var u = (payments[r.user_id] = payments[r.user_id] || { paid: {} });
        u.paid[r.session_id + '__' + r.role] = { amount: Number(r.amount) || 0, at: r.paid_at };
      });
      var profiles = {};

          try {

            await reload();
            var f = findInq(cur.id); if (f) cur = clone(f);
            toast(res.saved === false ? 'Mail wysłany, ale nie zapisano znacznika wysyłki.' : 'Mail wysłany do ' + res.to + '.');
            build();
          } catch (e) {
            gStatus.textContent = sendErrorText(e);
            sendBtn.disabled = false; armedSend = false; sendBtn.textContent = rep.sentAt ? 'Wyślij ponownie' : 'Wyślij mail do klienta';
          }
        });
      }
      mailSec = h('div', { class: 'sec' },
        h('h3', { text: 'Mail do klienta' }),
        cur.email ? h('div', { class: 'meta', text: 'Adres klienta: ' + cur.email }) : h('div', { class: 'banner', text: 'Klient nie podał e-maila. Odpowiedz telefonicznie.' }),
        fld('m-subj', 'Temat', subj), fld('m-body', 'Treść', body),
        h('div', { class: 'actions' },
          h('div', { class: 'r' },
            sendBtn,
            h('button', { class: 'btn', type: 'button', onclick: function () { copyText(body.value, body); } }, 'Kopiuj treść'),
            cur.email ? openMail : null),
          h('div', { class: 'r' },
            rep.sentAt ? h('span', { class: 'pill ok', id: 'm-sent', text: 'Wysłano ' + new Date(rep.sentAt).toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' }) }) : null,
            h('button', { class: 'btn', type: 'button', onclick: async function () {
              try { await save({ reply: Object.assign({}, rep, { sentAt: rep.sentAt ? null : new Date().toISOString() }) }); build(); }
              catch (e) { toast('Nie udało się zapisać.'); }
            } }, rep.sentAt ? 'Cofnij „wysłano”' : 'Oznacz jako wysłane'))),
        gStatus,
        h('div', { class: 'meta', text: 'Mail wychodzi z konta Gmail studia dopiero po potwierdzeniu, zawsze na adres klienta z zapytania. Treść możesz przed wysłaniem poprawić.' }));
    }

    var booked = cur.status === 'booked';
    var declBtn = h('button', { class: 'btn', type: 'button' }, 'Odrzuć');
    declBtn.addEventListener('click', async function () {
      if (!armedDecl) { armedDecl = true; declBtn.textContent = 'Potwierdź odrzucenie'; return; }
      try { await save({ status: 'declined' }); toast('Zapytanie odrzucone.'); closeForm(); } catch (e) { toast('Nie udało się zapisać.'); }
    });
    var delBtn = h('button', { class: 'btn danger', type: 'button' }, 'Usuń');
    delBtn.addEventListener('click', async function () {
      if (!armedDel) { armedDel = true; delBtn.textContent = 'Potwierdź usunięcie'; return; }
      try { await api.deleteInquiry(cur.id); await reload(); toast('Zapytanie usunięte.'); closeForm(); } catch (e) { toast('Nie udało się usunąć.'); }
    });
    var foot = h('div', { class: 'actions sec' },
      h('div', { class: 'r' },
        booked ? h('span', { class: 'pill ok', text: 'Zarezerwowane. Sesja jest w grafiku.' })
          : h('button', { class: 'btn primary', id: 'q-book', type: 'button', onclick: function () { closeForm(); openForm(null, { prefill: sessionPrefill(cur), inquiryId: cur.id }); } }, 'Klient potwierdził: utwórz sesję')),
      h('div', { class: 'r' }, !booked && cur.status !== 'declined' ? declBtn : null, delBtn, h('button', { class: 'btn', type: 'button', onclick: closeForm }, 'Zamknij')));

    var panel = h('div', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Zapytanie klienta' },
      h('div', { class: 'sess-head' }, h('h2', { text: catLabel(cur.category) }), h('span', { class: 'pill ' + st[1], text: st[0] })),
      h('dl', { class: 'dl' }, dlItems([
        kv('Klient', cur.name), kvCopy('E-mail', cur.email), kvCopy('Telefon', cur.phone),
        kv('Data', fmtLong(cur.date) + (cur.start ? ', start ' + cur.start : '')),
        kv('Czas pracy', cur.hours), kv('Miejsce', cur.location), kv('Goście', cur.guests),
        kv('Usługi', svcLabels(cur.services, cur.counts).join(', '))])),
      cur.details ? h('div', { class: 'note', text: cur.details }) : null,
      h('div', { class: 'sec' },
        h('h3', { text: 'Twoja wycena' }), h('div', { class: 'meta', style: 'margin-bottom:8px', text: 'Wpisz łączną cenę za daną usługę, dla wszystkich osób razem.' }), qrows,
        h('div', { class: 'meta' }, 'Razem: ', total),
        fld('q-msg', 'Wiadomość do klienta', msg), err,
        h('div', { class: 'actions' }, saveBtn)),
      mailSec, foot);
    ov.replaceChildren(panel); recalc();
  }
  build();
}


function openManual() {
  var ov = document.getElementById('overlay'); ov.replaceChildren(); ov.hidden = false;
  document.removeEventListener('keydown', onEsc); document.addEventListener('keydown', onEsc);
  var sel = h('select', { id: 'x-cat' }, Object.keys(CATS).map(function (k) { return h('option', { value: k, text: CATS[k] }); }));
  var fName = h('input', { id: 'x-name', type: 'text' }), fMail = h('input', { id: 'x-mail', type: 'email' }), fTel = h('input', { id: 'x-tel', type: 'tel' });
  var fDate = h('input', { id: 'x-date', type: 'date' }), fStart = h('input', { id: 'x-start', type: 'time' });
  var fHours = h('input', { id: 'x-hours', type: 'text', placeholder: 'np. 4 godz.' }), fLoc = h('input', { id: 'x-loc', type: 'text' }), fGuests = h('input', { id: 'x-guests', type: 'text' });
  var fDet = h('textarea', { id: 'x-det', placeholder: 'Opis, życzenia klienta' });
  var fCount = h('select', { id: 'x-count' }, [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return h('option', { value: String(n), text: String(n) }); }));
  var checks = ROLES.map(function (r) {
    var c = h('input', { id: 'x-s-' + r.key, type: 'checkbox' });
    return { r: r, el: c, node: h('label', { class: 'check', for: 'x-s-' + r.key }, c, r.label) };
  });
  var err = h('div', { class: 'err', role: 'alert' });
  var btn = h('button', { class: 'btn primary', type: 'button' }, 'Dodaj zapytanie');
  btn.addEventListener('click', async function () {
    if (!fName.value.trim()) { err.textContent = 'Wpisz imię klienta.'; fName.focus(); return; }
    var sv = checks.filter(function (c) { return c.el.checked; }).map(function (c) { return c.r.key; });
    if (!sv.length) { err.textContent = 'Zaznacz przynajmniej jedną usługę.'; return; }
    btn.disabled = true; err.textContent = '';
    var cnt = {}, cn = parseInt(fCount.value, 10) || 1;
    if (sv.indexOf('photographer') >= 0 && cn > 1) cnt.photographer = cn;
    var data = {
      name: fName.value.trim(), email: fMail.value.trim(), phone: fTel.value.trim(), category: sel.value,
      date: fDate.value, start: fStart.value, hours: fHours.value.trim(), location: fLoc.value.trim(), guests: fGuests.value.trim(),
      services: sv, counts: cnt, details: fDet.value.trim()
    };
    try {
      var id = await api.addInquiry(data);
      await reload();
      closeForm(); openInquiry(id);
    } catch (e) { btn.disabled = false; err.textContent = 'Nie udało się zapisać zapytania.'; }
  });
  ov.append(h('div', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Nowe zapytanie' },
    h('h2', { text: 'Nowe zapytanie' }),
    fld('x-cat', 'Rodzaj', sel), fld('x-name', 'Klient', fName),
    h('div', { class: 'two' }, fld('x-mail', 'E-mail', fMail), fld('x-tel', 'Telefon', fTel)),
    h('div', { class: 'two' }, fld('x-date', 'Data', fDate), fld('x-start', 'Start', fStart)),
    h('div', { class: 'two' }, fld('x-hours', 'Czas pracy', fHours), fld('x-guests', 'Goście', fGuests)),
    fld('x-loc', 'Miejsce', fLoc),
    h('div', { class: 'lbl', style: 'margin:4px 0 8px', text: 'Potrzebne usługi' }),
    h('div', { class: 'checks' }, checks.map(function (c) { return c.node; })),
    fld('x-count', 'Ilu fotografów (jeśli zaznaczony)', fCount),
    fld('x-det', 'Opis', fDet), err,
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: closeForm }, 'Anuluj'), btn)));
  fName.focus();
}


/* ---------- logowanie, odświeżanie, start ---------- */
var pollTimer = null, lastSig = '', reloading = null;

function stopPoll() { clearInterval(pollTimer); pollTimer = null; }
function startPoll() {
  stopPoll();
  pollTimer = setInterval(function () {
    if (document.hidden) return;
    if (state.auth === 'pending') enterApp(true);
    else if (state.auth === 'ready') reload();
  }, state.auth === 'pending' ? 12000 : 20000);
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { if (state.auth === 'ready') reload(); else if (state.auth === 'pending') enterApp(true); }
});

function goSignedOut(msg) {
  stopPoll();
  state.auth = 'out'; state.authError = msg || '';
  state.uid = null; state.me = null; state.isOwner = false; state.loaded = false;
  state.sessions = []; state.signups = {}; state.payments = {}; state.inquiries = []; state.people = []; state.profiles = {};
  lastSig = '';
  closeForm(); draw();
}
async function doSignOut() {
  await api.signOut();
  goSignedOut('');
}

function reload() {
  if (reloading) return reloading;
  reloading = (async function () {
    try {
      var d = await api.loadAll(state.isOwner);
      var people = state.isOwner ? await api.people() : [];
      var sig = JSON.stringify([d, people]);
      state.error = null;
      if (sig !== lastSig || !state.loaded) {
        lastSig = sig;
        state.sessions = d.sessions; state.signups = d.signups; state.payments = d.payments;
        state.inquiries = d.inquiries; state.profiles = d.profiles; state.people = people;
        state.loaded = true;
        draw();
      } else if (state.error === null && document.querySelector('.banner[role="alert"]')) { draw(); }
    } catch (e) {
      if (e && e.code === 'signed_out') { goSignedOut('Sesja wygasła. Zaloguj się ponownie.'); return; }
      state.error = (e && (e.code || e.message)) || 'błąd';
      if (state.loaded) draw();
      else { state.auth = 'error'; state.authError = 'Nie udało się pobrać danych (' + state.error + ').'; draw(); }
    } finally { reloading = null; }
  })();
  return reloading;
}

async function enterApp(quiet) {
  var p;
  try {
    p = await api.ensureProfile();
  } catch (e) {
    if (e && (e.code === 'signed_out' || e.status === 401)) { goSignedOut('Sesja wygasła. Zaloguj się ponownie.'); return; }
    if (quiet) return;
    state.auth = 'error'; state.authError = 'Nie udało się sprawdzić konta (' + ((e && (e.code || e.message)) || 'błąd') + ').'; draw(); return;
  }
  if (Array.isArray(p)) p = p[0];
  var wasPending = state.auth === 'pending';
  state.me = p; state.uid = p.id; state.isOwner = p.role === 'owner';
  if (!p.approved) {
    if (state.auth !== 'pending') { state.auth = 'pending'; startPoll(); draw(); }
    return;
  }
  state.auth = 'ready';
  state.viewAs = state.isOwner ? 'owner' : 'worker';
  if (!state.isOwner && state.tab === 'inq') state.tab = 'sessions';
  state.loaded = false; lastSig = '';
  draw();
  await reload();
  startPoll();
  if (wasPending) toast('Konto zatwierdzone. Witaj w ekipie!');
}

async function setApproved(uid, on) {
  try { await api.setApproved(uid, on); await reload(); toast(on ? 'Osoba zatwierdzona.' : 'Dostęp odebrany.'); }
  catch (e) { handleWriteError(e); }
}

async function boot() {
  if (!api.configured()) { state.auth = 'unconfigured'; draw(); return; }
  var u = null;
  try { u = await api.init(); }
  catch (e) {
    if (e && e.code === 'network') { state.auth = 'error'; state.authError = 'Brak połączenia z serwerem.'; draw(); return; }
    state.auth = 'out'; state.authError = (e && e.code === 'oauth') ? 'Logowanie nie powiodło się: ' + e.message : (e && e.message) || ''; draw(); return;
  }
  if (!u) { state.auth = 'out'; draw(); return; }
  await enterApp();
}
boot();

})();
</script>
